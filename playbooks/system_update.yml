---
- name: Update managed nodes
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update packages on Fedora
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Update APT cache on Ubuntu
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Upgrade packages on Ubuntu
      ansible.builtin.apt:
        upgrade: dist
      when: ansible_facts['os_family'] == 'Debian'
